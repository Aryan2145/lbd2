# Builds the LBD Docker image and pushes it to the GitHub Container Registry
# (GHCR). Runs on every push to master, and can be triggered by hand from the
# Actions tab ("Run workflow").
#
# LBD ships frontend + backend in ONE image (pm2 runs both — see ecosystem.config.js),
# so unlike a split frontend/backend setup the matrix here is over ENVIRONMENTS,
# not components. NEXT_PUBLIC_* values are compiled into the browser bundle at
# build time, so production and staging need genuinely separate builds.
#
# Images produced:
#   ghcr.io/aryan2145/lbd2:production   (+ production-<sha>)
#   ghcr.io/aryan2145/lbd2:staging      (+ staging-<sha>)
#
# GHCR login uses the automatic GITHUB_TOKEN — no secret to configure here.
name: Build & push images

on:
  push:
    branches: [master]
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# GHCR paths must be lowercase. Owner "Aryan2145" -> "aryan2145".
env:
  IMAGE: ghcr.io/aryan2145/lbd2

# Allow this workflow to push packages (images) using GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

# If you push twice quickly, cancel the older run.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Production only — staging has never run on the EC2 box, so building it
        # would burn CI minutes and GHCR storage for an unused image. To add it,
        # append:
        #   - environment: staging
        #     api_url: https://api.lbd-staging.rgbindia.com
        # and restore the lbd_staging service in docker-compose.deploy.yml.
        include:
          - environment: production
            api_url: https://api.lbd.rgbindia.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.environment }}
        uses: docker/build-push-action@v6
        with:
          # Root context: the Dockerfile copies both frontend/ and backend/.
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.environment }}
            ${{ env.IMAGE }}:${{ matrix.environment }}-${{ github.sha }}
          # Baked into the Next.js bundle at build time — a runtime env var is
          # ignored for NEXT_PUBLIC_*, so these MUST be build args. Values match
          # the ones docker-compose.yml used when EC2 still built locally.
          build-args: |
            NEXT_PUBLIC_APP_ENV=${{ matrix.environment }}
            NEXT_PUBLIC_API_URL=${{ matrix.api_url }}
          # Speed up repeat builds by caching layers in GitHub Actions.
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.environment }}
