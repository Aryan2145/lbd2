# BUILDS FROM SOURCE — for local use, or as a fallback if GHCR is unavailable.
#
# On EC2 use docker-compose.deploy.yml (via ./deploy.sh) instead: it pulls the
# images GitHub Actions already built, rather than building on the box. See
# DEPLOYMENT.md.
services:
  lbd_production:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_API_URL: https://api.lbd.rgbindia.com
    container_name: lbd_production
    env_file: .env.production
    volumes:
      - /etc/secrets/encryption.key:/etc/secrets/encryption.key:ro
    ports:
      - "3100:3000"
      - "4100:4000"
    restart: unless-stopped

  lbd_staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: staging
        NEXT_PUBLIC_API_URL: https://api.lbd-staging.rgbindia.com
    container_name: lbd_staging
    env_file: .env.staging
    ports:
      - "3101:3000"
      - "4101:4000"
    restart: unless-stopped
